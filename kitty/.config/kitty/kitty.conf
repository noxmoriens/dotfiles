# set term to xterm256-color
term xterm-256color

# set display server use x11
# linux_display_server x11

# window size and properties
remember_window_size no
initial_window_width 100
initial_window_height 40

# performance
input_delay 0
repaint_delay 5
sync_to_monitor no
wayland_enable_ime no

# cursor trail
cursor_trail 3
cursor_trail_start_threshold 3
cursor_trail_decay 0.15 0.35
cursor_shape beam
cursor_blink_interval 0.8


# fonts
# font_family ComicShannsMono Nerd Font Mono
# font_family MartianMono Nerd Font Mono
font_family FantasqueSansM Nerd Font Mono
font_size 13.85
# disable_ligatures always

# themes
dynamic_background_opacity yes
background_opacity 0.95
# include themes/CatppuccinMocha.conf
include themes/rose-pine-moon.conf

# padding
window_padding_width 12

# map
# map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+t none
map shift+enter send_text all \e[13;2u
