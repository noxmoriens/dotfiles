"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
continuation_prompt = "[󰞷](dimmed white)[](bold dimmed white)[](bold dimmed magenta)[󰅂](bold dimmed blue)"

right_format = """
"""

[character]
success_symbol = "[](bold magenta)"
error_symbol = "[](bold red)"

[package]
disabled = false

[git_branch]
symbol = "[](bold #3e8fb0) "
truncation_length = 4
truncation_symbol = ""
style = "bold #c4a7e7"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[ PICKING](bold red)"

[cmd_duration]
disabled = false
format = '[$duration](bold #c4a7e7) [󰅒](bold #9ccfd8)'

[git_status]
conflicted = ""
ahead = " "
behind = " "
diverged = "󰨁 "
untracked = "[](bold #f6c177) "
stashed = "󰆼 "
modified = " "
staged = '[ \($count\)](bold #3e8fb0) '
renamed = " "
deleted = " "
style = "bold #c4a7e7"
format = "$all_status$ahead_behind"

[hostname]
ssh_only = false
format =  "on [](bold #9ccfd8) [$hostname](bold #c4a7e7) "
trim_at = ".localdomain"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '[](blue) [$time](dimmed blue) '
time_format = "%T"

[username]
style_user = "bold #c4a7e7"
style_root = "bold red"
format = "[](bold #c4a7e7) [$user]($style) "
disabled = false
show_always = true

[directory]
read_only = ''
truncation_length = 3
truncation_symbol = ''
format = "[](bold #9ccfd8) [$path](bold #3e8fb0) [$read_only]($read_only_style)"
disabled = false

[rust]
symbol = ""
format = "via [$symbol ($version)](bold red) "

[nodejs]
symbol = "󰎙"
format = "via [$symbol](bold green) "

[bun]
symbol = ""
format = "via [$symbol ($version)](bold white) "

[dart]
symbol = ""
format = "via [$symbol ($version)](bold sky) "

[python]
symbol = ""
format = "via [$symbol ($version)](bold green) "

[java]
symbol = ""
format = "via [$symbol ($version)](bold white) "

[kotlin]
symbol = ""
format = "via [$symbol ($version)](bold blue) "

[gradle]
symbol = ""
format = "via [$symbol ($version)](bold cyan) "

[php]
symbol = ""
format = "via [$symbol ($version)](bold blue) "

[zig]
symbol = ""
format = "via [$symbol ($version)](bold yellow) "
